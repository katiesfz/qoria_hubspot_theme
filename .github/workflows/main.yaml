name: Deploy HubSpot Theme - Live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: [ANZ, US]
        include:
          - account: ANZ
            portal_id: ${{ secrets.HUBSPOT_ACCOUNT_ID_ANZ }}
            access_key: ${{ secrets.HUBSPOT_PAK_ANZ }}
          - account: US
            portal_id: ${{ secrets.HUBSPOT_ACCOUNT_ID_US }}
            access_key: ${{ secrets.HUBSPOT_PAK_US }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HubSpot Deploy Action
        uses: HubSpot/hubspot-cms-deploy-action@v2
        with:
          account_id: ${{ matrix.portal_id }}
          personal_access_key: ${{ matrix.access_key }}
          src_dir: qoria-theme
          dest_dir: q-theme