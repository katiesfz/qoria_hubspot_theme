name: Deploy HubSpot Theme - Live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account:
          - name: LW-ANZ
            token: ${{ secrets.HUBSPOT_PAK_ANZ }}
          - name: LW-US
            token: ${{ secrets.HUBSPOT_PAK_US }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.19.0'

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli

      - name: Authenticate and Upload Theme
        run: |
          echo "${{ matrix.account.token }}" > token.txt
          hs auth personalaccesskey --key "$(cat token.txt)" --name "${{ matrix.account.name }}"
          hs upload qoria-theme q-theme --account "${{ matrix.account.name }}"
