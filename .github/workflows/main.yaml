name: Deploy HubSpot Theme - Live

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account: [ANZ, US]
        include:
          - account: ANZ
            portal_id: HUBSPOT_ACCOUNT_ID_ANZ
            access_key: HUBSPOT_PAK_ANZ
          - account: US
            portal_id: HUBSPOT_ACCOUNT_ID_US
            access_key: HUBSPOT_PAK_US

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: HubSpot Deploy Action
        uses: HubSpot/hubspot-cms-deploy-action@v2.1.0
        with:
          account_id: ${{ secrets[matrix.portal_id_key] }}
          personal_access_key: ${{ secrets[matrix.pak_key] }}
          src_dir: qoria-theme
          dest_dir: q-theme