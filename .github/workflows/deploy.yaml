name: Deploy HubSpot Theme

on:
  push:
    branches:
      - sandbox
      - main

# Each portal gets the parent theme plus only the child themes whose pages live there:
#   ANZ: au, nz, corp    UK: uk, es, eu    US: us
jobs:
  deploy-anz:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      HUBSPOT_ACCOUNT_ID: ${{ vars.HS_ACCT_ID_ANZ }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.PAK_AU_KS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@7.9.0

      - name: Deploy q-theme to ANZ
        run: hs upload hubspot/q-theme q-theme --use-env --convertFields

      - name: Deploy qoria-theme-au to ANZ
        run: hs upload hubspot/qoria-theme-au qoria-theme-au --use-env --convertFields

      - name: Deploy qoria-theme-nz to ANZ
        run: hs upload hubspot/qoria-theme-nz qoria-theme-nz --use-env --convertFields

      - name: Deploy qoria-theme-corp to ANZ
        run: hs upload hubspot/qoria-theme-corp qoria-theme-corp --use-env --convertFields

  deploy-uk:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      HUBSPOT_ACCOUNT_ID: ${{ vars.HS_ACCT_ID_UK }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.PAK_UK_KS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@7.9.0

      - name: Deploy q-theme to UK
        run: hs upload hubspot/q-theme q-theme --use-env --convertFields

      - name: Deploy qoria-theme-uk to UK
        run: hs upload hubspot/qoria-theme-uk qoria-theme-uk --use-env --convertFields

      - name: Deploy qoria-theme-es to UK
        run: hs upload hubspot/qoria-theme-es qoria-theme-es --use-env --convertFields

      - name: Deploy qoria-theme-eu to UK
        run: hs upload hubspot/qoria-theme-eu qoria-theme-eu --use-env --convertFields

  deploy-us:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      HUBSPOT_ACCOUNT_ID: ${{ vars.HS_ACCT_ID_US }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.PAK_US_KS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli@7.9.0

      - name: Deploy q-theme to US
        run: hs upload hubspot/q-theme q-theme --use-env --convertFields

      - name: Deploy qoria-theme-us to US
        run: hs upload hubspot/qoria-theme-us qoria-theme-us --use-env --convertFields
