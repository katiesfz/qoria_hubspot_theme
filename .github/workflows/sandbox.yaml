name: Deploy HubSpot Theme - Sandbox

on:
  push:
    branches:
      - sandbox

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account:
          - name: LW-ANZ-SB
            id: 112233

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: HubSpot Deploy Action ANZ
        uses: HubSpot/hubspot-cms-deploy-action@v2.1.0
        with:
          account_id: ${{ secrets.HUBSPOT_ACCOUNT_ID_SANDBOX }}
          personal_access_key: ${{ secrets.HUBSPOT_PAK_ANZ_SB }}
          src_dir: qoria-theme
          dest_dir: q-theme
