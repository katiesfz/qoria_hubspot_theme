name: Deploy HubSpot Theme - Sandbox

on:
  push:
    branches:
      - sandbox

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        account:
          - name: LW-ANZ-SB

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.19.0'

      - name: Install HubSpot CLI
        run: npm install -g @hubspot/cli

      - name: Authenticate and Upload Theme
        run: |
          echo "${{ secrets.HUBSPOT_PAK_ANZ_SB }}" > token.txt
          hs auth --pak "$(cat token.txt)" --account "${{ matrix.account.name }}"
          hs upload qoria-theme q-theme --account "${{ matrix.account.name }}"
