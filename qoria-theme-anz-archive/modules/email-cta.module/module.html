{% if module.link.url.href %}
    {% set href = module.link.url.href %}
    <div style="text-align: {{ module.cta_alignment }};">
    <a href="{{ href }}" target="_blank" style="display: inline-block; text-decoration: none; border: 1px solid #000000; border-radius: 4px; padding: 16px 24px; font-weight: bold; color: #000000; Margin-top: {{ module.content_padding.padding_y }}px;">
      {{ module.link_text }}
    </a>
    </div>
{% endif %}
