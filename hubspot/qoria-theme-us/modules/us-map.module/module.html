		<script>
		
		function buildQuoteMarker(state, zip = "769", popup, author, content, accent){
		const quoteMarker = document.createElement("div");
		quoteMarker.classList.add("position-absolute","d-block","d-{{module.style.breakpoint}}-block","rounded-circle","bg-secondary","quote-marker");

		// calculate position

		let map = document.getElementById("usLocations");

		let mapSvg = map.querySelector("svg");

		// let anchor = map.querySelector("#" + state + " .anchor");

		let zipSvg = mapSvg.querySelector('[data-zip="' + zip + '"]');

		if (zipSvg) {
			let zipSvgContainer = zipSvg.getBBox();

			let mapWidth = mapSvg.viewBox.baseVal.width; 
			let mapHeight = mapSvg.viewBox.baseVal.height;

			let zipBoxWidth = zipSvgContainer.width;
			let zipBoxHeight = zipSvgContainer.height;
			let zipBoxX = zipSvgContainer.x;
			let zipBoxY = zipSvgContainer.y;

			let quotePosX = ((zipBoxX + zipBoxWidth/2)/mapWidth) * 100;
			let quotePosY = ((zipBoxY + zipBoxHeight/2)/mapHeight) * 100;

			//let quotePosX = (anchor.cx.baseVal.value/mapWidth)*100;
			//let quotePosY = (anchor.cy.baseVal.value/mapHeight)*100;

			var headerStyle = "";

			if (accent == "none"){
				headerStyle += "";
			} else {
				headerStyle += accent + " text-light fw-semibold"
			}

			if (popup == true) {
			quoteMarker.dataset.bsToggle = "popover";
			quoteMarker.dataset.bsTitle = author;
			quoteMarker.dataset.bsContent = content;
			quoteMarker.dataset.bsContainer = "#usLocations";
			quoteMarker.dataset.bsTrigger = 'hover focus';
			quoteMarker.dataset.bsTemplate = '<div class="popover" role="tooltip"><div class="popover-arrow"></div><h3 class="popover-header bg-' + headerStyle + '"></h3><div class="popover-body"></div></div>';
			}

			quoteMarker.style.top = quotePosY+"%";
			quoteMarker.style.left = quotePosX+"%";
			quoteMarker.style.transform = "translate(-50%, -50%)";
			quoteMarker.style.width = "0.3em";
			quoteMarker.style.height = "0.3em";

			map.append(quoteMarker);
			}
		}

		document.addEventListener("DOMContentLoaded", () => {

		var map = document.querySelector('#usLocations');

		{% for location in module.location %}
			buildQuoteMarker("{{location.state}}", "{{location.zip|trim|truncate(3,true,"") if location.zip else "769"}}", {{location.popup_toggle if location.popup_toggle else false}}, "{{location.popup.author if location.popup_toggle}}{{", " + location.popup.role if (location.popup_toggle && location.popup.role)}}", "{{location.popup.quote if location.popup_toggle}}", "{{location.popup.accent_colour if location.popup_toggle}}");
		{% endfor %}

		{% if hub_id == 5840292 %}
		// TEMPORARY hack - use a hubdb to post the zip codes
			{% set zips = hubdb_table_rows(7922097, "limit=3000") %}

			{% for zip in zips %}
				{% if zip.zip_code != null  %}
				buildQuoteMarker("{{zip.state}}", "{{zip.zip_code|trim|truncate(3,true,"")}}", false, "", "", "");
				{% endif %}
			{% endfor %}
		// end temporary hack
		{% endif %}

		const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]')
		const popoverList = [...popoverTriggerList].map(popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl))

		});

		</script>

	</div>
	{% if module.location_label %}
	<div class="key p-3 mt-3 mx-auto w-auto d-inline-block text-start">
		<div class="d-none d-{{module.style.breakpoint}}-block">
			<div class="bg-secondary rounded-circle d-inline-block align-middle me-1" style="height: 0.5em; width: 0.5em;"></div>
			<span class="align-middle">{{module.location_label}}</span>
		</div>
	</div>
	{% endif %}
