{# Divider - version 1 #}

{# Module styles #}

{% require_css %}
  <style>
  {% scope_css %}
    hr {
      border: 0 none;
      border-bottom-width: {{ module.styles.line.thickness ~ "px" }};
      border-bottom-style: {{ module.styles.line.style }};
      {% if module.styles.line.color %}
      border-bottom-color: rgba({{ module.styles.line.color.color|convert_rgb }}, {{ module.styles.line.color.opacity / 100 }});
      {% endif %}
      margin-left: {{ "auto" if (module.styles.alignment.alignment.horizontal_align == "CENTER" or module.styles.alignment.alignment.horizontal_align == "RIGHT") else "0" }};
      margin-right: {{ "auto" if (module.styles.alignment.alignment.horizontal_align == "CENTER" or module.styles.alignment.alignment.horizontal_align == "LEFT") else "0" }};
      {% if module.styles.spacing.spacing.css %}
        {{ module.styles.spacing.spacing.css }}
      {% endif %}
      width: {{ module.styles.size.width ~ "%" }};
    }
    {% if module.styles.divider_style == "stripe" %}
      hr{
      height: {{module.styles.size.height ~ "px"}};
      background-image: linear-gradient(
        to bottom,
        #58b78e 0 20%,
        #515ba5 20% 40%,
        #666b9f 40% 60%,
        #df6463 60% 80%,
        #eeab49 80% 100%
      );
      }
    {% endif %}
    {% if module.styles.divider_style == "control-panel" %}
      hr {
      height: {{module.styles.size.height ~ "px"}};
      position: relative;
      perspective: 900px;
      overflow: hidden;
      }
      hr:before {
      content: "";
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-image: url({{get_asset_url('../../../../images/campaigns/all-systems-go/control-panel-tile.png')}});
      background-repeat: repeat-x;
      background-size: auto 100%;
      background-position: 50% 50%;
      transform: rotateX(10deg) scale(1.1);
      transform-origin: 50% 50%;
      }
    {% endif %}
    {% if module.styles.divider_style == "rivet" %}
      hr {
      height: {{module.styles.size.height ~ "px"}};
      position: relative;
      perspective: 900px;
      overflow: hidden;
      }
      hr:before {
      content: "";
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-image: url({{get_asset_url('../../../../images/campaigns/all-systems-go/rivet-tile.png')}});
      background-repeat: repeat-x;
      background-size: auto 100%;
      background-position: 50% 50%;
      transform: rotateX(10deg) scale(1.1);
      transform-origin: 50% 50%;
      }
    {% endif %}
    {% if module.styles.divider_style == "dotted" %}
      hr {
        height: {{(module.styles.size.height * 2 - 1) ~ "px"}};
        width: 100%;
        background-image: radial-gradient(circle, #cfb88e {{(module.styles.size.height -1) ~ "px"}}, transparent {{(module.styles.size.height) ~ "px"}});
        background-size: {{(module.styles.size.height * 6) ~ "px"}} 100%; 
        background-repeat: repeat-x;
      }
    {% endif %}
  {% end_scope_css %}
  </style>
{% end_require_css %}

  <hr>
