<table
  style="
    border: 3px solid black;
    border-color: {{module.accent_colour}};
    box-shadow: 10px 10px 0px {{module.accent_colour}};
    background: #ffffff;
    width: 100%;
  "
>
  <tr>
    <td style="padding: 30px; text-align: left">
       {{module.content}}
       {% if module.link.url.href %}
        <div class="" style="display: block; text-align: {{module.cta_alignment}};">
            <a
                style="
                color: #ffffff;
                background-color: {{module.cta_colour}};
                padding: 12px 24px;
                display: inline-block;
                align: center;
                margin-top: 8px;
                border-radius: 0px;
                text-decoration: none;
                font-weight: bold;
                font-size: 14px;
                box-shadow: 0px 0px 0px 3px #ffffff, 10px 10px 0px {{module.cta_shadow_colour}};
                "
                href="{{module.link.url.href}}"
                >{{module.link_label}}</a
            >
        </div>
       {% endif %}
    </td>
  </tr>
</table>
