<div id="easyWebinar-{{name}}" class="d-none">{{module.embed_code}}</div>

<script>
function waitForElement(selector, callback, timeout) {
    // Initialize a mutation observer
    var observer = new MutationObserver(function(mutations, me) {
        // Query for the element
        var element = document.querySelector(selector);
        if (element) {
            callback(element);
            // Once we have found the element, we can stop observing for mutations
            me.disconnect();
            return;
        }
    });

    // Start observing the document with the configured parameters
    observer.observe(document, { childList: true, subtree: true });

    // Set a timeout to stop observing after the specified period of time
    setTimeout(function() {
        observer.disconnect();
    //    console.log(`Element not found within ${timeout}ms. Disconnecting observer.`);
    }, timeout);
}

document.addEventListener("DOMContentLoaded", () => {

waitForElement('#easyWebinar-{{name}} .ew-body', function(element) {
//    console.log("The element #myElement now exists!");
    
    const ewForm = document.querySelector("#easyWebinar-{{name}} .ew-body");
    const container = document.querySelector("#easyWebinar-{{name}}");
    
    var l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "{{ get_asset_url('../../css/easy-webinar-styles.min.css')}}";
    ewForm.prepend(l);
    container.classList.remove("d-none");

}, 5000); // Timeout after 5,000ms (5 seconds)

});
</script>
