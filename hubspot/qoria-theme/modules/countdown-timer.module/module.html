{% require_css %}
    <style>
        {% scope_css %}
            .label {
                {{ module.advanced.unit_styling }}
                }
            .number {
                {{ module.advanced.number_styling }}
                }
        {% end_scope_css %}
    </style>
{% end_require_css %}

<div id="countdown-timer-{{ module_id }}" class="countdown-timer-module">
  <div class="row">
    <div class="col">
        <div id="days" class="time-segment">
            <span class="number {{module.advanced.number_classes}}">0</span>
            <span class="label {{module.advanced.unit_classes}}">Days</span>
        </div>
    </div>
    <div class="col">
        <div id="hours" class="time-segment">
            <span class="number {{module.advanced.number_classes}}">0</span>
            <span class="label {{module.advanced.unit_classes}}">Hours</span>
        </div>
    </div>
    <div class="col">
        <div id="minutes" class="time-segment">
            <span class="number {{module.advanced.number_classes}}">0</span>
            <span class="label {{module.advanced.unit_classes}}">Minutes</span>
        </div>
    </div>
    <div class="col">
        <div id="seconds" class="time-segment">
            <span class="number {{module.advanced.number_classes}}">0</span>
            <span class="label {{module.advanced.unit_classes}}">Seconds</span>
        </div>
    </div>
  </div>
</div>

<script>
{% if module.end_date %}
    document.addEventListener("DOMContentLoaded", function() {
        countdown({{ module.end_date|format_date('dd') }}, {{ module.end_date|format_date('MM') }}, {{ module.end_date|format_date('yyyy') }}, function() {});
    });
{% endif %}

</script>
