
{% require_css %}
   <style>
    {%scope_css%}
      .spotlight-overlay {
        --spotlight-size: {{module.styles.cursor_size|divide(2)}}px;
        mask-image: radial-gradient(
          circle var(--spotlight-size) at var(--x, 50%) var(--y, 50%), 
          rgba(0,0,0,var(--spotlight-t)) 100%, 
          black 100%
        );
        -webkit-mask-image: radial-gradient(
          circle var(--spotlight-size) at var(--x, 50%) var(--y, 50%),
          rgba(0,0,0,var(--spotlight-t)) 0%, 
          black 100%
        );
      }
    {% end_scope_css %}
   </style>
{% end_require_css %}

{% if is_in_editor %}
  {% editor_placeholder %}
{% else %}
  <div class="spotlight-overlay"></div>
{% endif %}
