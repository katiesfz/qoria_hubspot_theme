    <script>


    const container = document.getElementById("pulseSimContainer");
    const questionContainer = document.getElementById("question");
    const answersContainer = document.getElementById("answers");
    var submittedAnswers = [];
        
        function showQuestion(id = 1) {

        let questionData = pulseQuestions.find(item => item.id === id);

        // clear question and answer container

        questionContainer.innerHTML = "";
        answersContainer.innerHTML = "";


        // print new question

        const newQuestion = new DocumentFragment();

        let newQuestionText = document.createElement("p");
        newQuestionText.classList.add("question");
        newQuestionText.innerText = questionData["question"];

        newQuestion.append(newQuestionText);
        questionContainer.append(newQuestion);

        // print answers

        const newAnswers = new DocumentFragment();
        var answersData = questionData["options"];
        for (let i=0; i < answersData.length; i++) {
            let newOption = document.createElement("a");
            newOption.innerHTML = answersData[i].text;
            if (answersData[i].status == "disabled") {
                newOption.classList.add("btn-disabled");
            }
            newOption.classList.add("btn","btn-sm", "btn-light", "rounded-pill", "mb-2", "me-2", "pulse-answer");
            newOption.id = "answer" + [i];
            
            newAnswers.append(newOption);
        }
        answersContainer.append(newAnswers);

        }
