{% if module.heading_tag == "h1" %}
<h2 class="h1 {{ "text-decoration-partial-underline" if module.heading_underline }}">{{module.heading}}</h2>
{% else %}
<{{module.heading_tag}} {{ "class='text-decoration-partial-underline'" if module.heading_underline }}>{{module.heading}}</{{module.heading_tag}}>
{% endif %}
