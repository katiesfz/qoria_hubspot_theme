<style type="text/css" data-hse-inline-css="true">

{% set fontStack = "Quicksand, " + primary_font %}
* {
    font-family: {{ fontStack }} !important;
}

table, tr, td, th, ol, li, ul, p, h1, h2, h3, h4, h5, h6 {
    font-family: {{ fontStack }} !important;
    font-weight: 400;
}

table, tr, td, th, ol, li, ul, p {
    line-height: 150%;
}

h1, h2, h3, h4, h5, h6 {
    line-height: 120% !important;
}

table, tr, td, th, ol, li, ul, p {
    font-size: 14px;
}

p + p {
    margin-top: 1rem;
    Margin-top: 1rem;
}

h1 + p, h2 + p, h3 + p, h4 + p, h5 + p, h6 + p {
    Margin-top: .5em;
    margin-top: .5em;
}

.footer p {
    Margin-top: 0;
    margin-top: 0;
}



.article h2 {
    font-size: 1.25rem !important;
    line-height: 125% !important;
}
