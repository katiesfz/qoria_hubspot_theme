<div style="{{module.styles.spacing_field.css}}">
    <div class="row {{name}}">
        <div class="col-12">
            <div class="row g-0 d-flex d-md-none">
                <div class="col-6 text-center">
                    <div class="">
                        {{module.top_left}}
                    </div>
                </div>
                <div class="col-6 text-center">
                    <div class="">
                        {{module.top_right}}
                    </div>
                </div>
            </div>

            <div class="row h-md-100 g-0">
                <div class="col-12  col-md d-none d-md-flex flex-column h-md-100">
                    <div class="row h-50 align-items-center">
                        <div class="col d-flex justify-content-between align-items-center">
                            <div class="">
                                {{module.top_left}}
                            </div>
                        </div>
                    </div>
                    <div class="row h-50 align-items-center">
                        <div class="col d-flex justify-content-between align-items-center">
                        <div class="">
                                {{module.bottom_left}}
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12  col-md-auto col-lg-6 d-none d-md-flex justify-content-center align-items-center">
                    <img src="{{ get_asset_url('/q-theme/images/qoria/connect/connect_diagram.svg') }}" class="w-100" style="max-width: 500px;">
                </div>
                <div class="col-12  col-md-auto col-lg-5 d-flex d-md-none justify-content-center align-items-center">
                    <img src="{{ get_asset_url('/q-theme/images/qoria/connect/connect_diagram_sm.svg') }}" class="w-100" style="max-width: 500px;">
                </div>
                <div class="col-12  col-md d-none d-md-flex flex-column h-100">
                    <div class="row h-50 align-items-center">
                        <div class="col d-flex justify-content-between align-items-center">
                            <div class="">
                                {{module.top_right}}
                            </div>
                        </div>
                    </div>
                    <div class="row h-50 align-items-center">
                        <div class="col d-flex justify-content-between align-items-center">
                            <div class="">
                                {{module.bottom_right}}
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row g-0 d-flex d-md-none">
                <div class="col-6 text-center">
                    <div class="">
                        {{module.bottom_left}}
                    </div>
                </div>
                <div class="col-6 text-center">
                    <div class="">
                        {{module.bottom_right}}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
