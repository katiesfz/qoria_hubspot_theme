{% if module.menu_tree %}
    <ul class="{{ "list-inline" if module.orientation == "horizontal" }} list-unstyled">
{% for link in module.menu_tree %}
        <li class="mb-2">
            <a href="{{link.url}}" target="{{link.linkTarget}}" class="text-decoration-none text-reset">{{ link.linkLabel }}</a>
        </li>
{% endfor %}
    </ul>
{% endif %}
